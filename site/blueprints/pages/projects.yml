title:
  de: Projekte
  en: Projects

options:
  changeStatus: false
  delete: false

icon: 👨‍💻

buttons:
  - open
  - settings
  - copilot
  - languages

tabs:
  projects:
    label:
      de: Projekte
      en: Projects
    icon: grid
    columns:
      - width: 1/3
        sections:
          drafts:
            type: pages
            template: project
            label:
              de: Entwürfe
              en: Drafts
            status: draft

          unlisted:
            type: pages
            template: project
            label:
              de: Ungelistet
              en: Unlisted
            status: unlisted

      - width: 2/3
        sections:
          listed:
            type: pages
            template: project
            info: "{{ page.subtitle }}"
            label:
              de: Veröffentlichte Projekte
              en: Published Projects
            status: listed
            layout: cards
            image:
              query: page.thumbnail.toFile
              cover: true

  content:
    label:
      de: Inhalt
      en: Content
    icon: text
    columns:
      - width: 2/3
        sections:
          content:
            type: fields
            fields:
              text: fields/blocks

      - width: 1/3
        sections:
          meta:
            extends: sections/meta
            type: fields
            fields:
              thumbnail:
                query: page.children.files.template("image")
                uploads: false

  images: tabs/images
