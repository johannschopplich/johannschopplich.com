name: Tweet
icon: website-x
wysiwyg: true
preview: fields
fields:
  url:
    label:
      de: Adresse
      en: URL
    type: url
    icon: url
    placeholder: https://x.com/user/status/<tweet_id>
  text:
    label: Text
    type: writer
    nodes: false
    placeholder: field.blocks.text.placeholder
  published:
    label:
      de: Veröffentlicht
      en: Published
    type: date
    display: DD.MM.YYYY
  retweets:
    label: Retweets
    type: number
    min: 0
    step: 1
    width: 1/2
  likes:
    label: Likes
    type: number
    min: 0
    step: 1
    width: 1/2
  external:
    label:
      de: Verfasst von
      en: Written by
    type: toggle
    default: false
    text:
      - de: Mir
        en: Me
      - de: Jemand anderem
        en: Someone else
  author:
    label:
      de: Anzeigename
      en: Display name
    type: text
    icon: user
    width: 1/2
    when:
      external: true
  avatar:
    label:
      de: Profilbild
      en: Avatar
    type: files
    multiple: false
    uploads:
      template: image
    width: 1/2
    when:
      external: true
  image:
    label: field.blocks.image.name
    type: files
    multiple: false
    image:
      back: black
    uploads:
      template: image
  caption:
    label: field.blocks.image.caption
    type: writer
    icon: text
    inline: true
